name: Update investment dashboard data

on:
  schedule:
    # Three post-close attempts for provider-lag resilience.
    # 09:35, 11:35 and 13:35 Asia/Taipei, Tuesday-Saturday.
    - cron: '35 1 * * 2-6'
    - cron: '35 3 * * 2-6'
    - cron: '35 5 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_market_data.py'
      - '.github/workflows/update-dashboard.yml'

permissions:
  contents: write

concurrency:
  group: dashboard-data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas pandas-market-calendars requests

      - name: Update market and financial data
        run: python scripts/update_market_data.py

      - name: Commit data.json if changed
        shell: bash
        run: |
          if git diff --quiet -- data.json; then
            echo 'No changes to data.json.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto-update dashboard data $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
