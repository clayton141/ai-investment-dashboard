name: Update investment dashboard data

on:
  schedule:
    # Multiple post-close attempts so the dashboard is current before Taiwan work hours.
    # 07:17, 08:17, 09:17 and 11:17 Asia/Taipei. The script identifies
    # the latest completed NYSE session and safely no-ops on holidays/weekends.
    - cron: '17 23 * * *'
    - cron: '17 0 * * *'
    - cron: '17 1 * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_market_data.py'
      - '.github/workflows/update-dashboard.yml'

permissions:
  contents: write

concurrency:
  group: dashboard-data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas pandas-market-calendars requests

      - name: Update market and financial data
        run: python scripts/update_market_data.py

      - name: Commit data.json if changed
        shell: bash
        run: |
          if git diff --quiet -- data.json market-data.js; then
            echo 'No changes to data.json.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json market-data.js
          git commit -m "Auto-update dashboard data $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
