name: Update dashboard premarket prices

on:
  schedule:
    # Every 15 minutes, staggered away from busy clock boundaries. The script itself
    # checks America/New_York time, so only true US premarket bars are written.
    - cron: '7,22,37,52 8-15 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_premarket.py'
      - '.github/workflows/update-premarket.yml'

permissions:
  contents: write

concurrency:
  group: dashboard-premarket-update
  cancel-in-progress: true

jobs:
  update-premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas

      - name: Update premarket snapshot
        run: python scripts/update_premarket.py

      - name: Commit data.json if changed
        shell: bash
        run: |
          if git diff --quiet -- data.json market-data.js; then
            echo 'No premarket changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json market-data.js
          git commit -m "Auto-update premarket prices $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push origin HEAD:main
